<svg xmlns="http://www.w3.org/2000/svg" width="840" height="222" viewBox="0 0 840 222" role="img" aria-label="Profile signal: 15 contributions, 2 repos, 5 active days" fill="none">
<style>
.s{font-family:'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bar{transform-box:fill-box;transform-origin:0 50%;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) backwards}
